name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Sintassi JavaScript
        run: for f in droidmac/static/js/*.js; do node --check "$f"; done
      - name: Script di shell
        run: bash -n scripts/build-app.sh DroidMac.command
